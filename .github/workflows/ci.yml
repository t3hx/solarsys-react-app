name: CI

# ~ Le pipeline vit dans t3hx/workflows : ce fichier ne fait que l'appeler.
# ~ PR -> verify ; merge sur main -> verify puis deploy (version, image, Dokploy, verif, release).
on:
  pull_request:
  push:
    branches: [main]

# ~ PR : un nouveau push annule le run en cours. main : les deploiements passent en file,
# ~ jamais interrompus en vol.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: t3hx/workflows/.github/workflows/verify.yml@main
    with:
      e2e: true

  deploy:
    if: github.event_name == 'push'
    needs: verify
    uses: t3hx/workflows/.github/workflows/deploy.yml@main
    # ~ Un workflow appele ne peut pas avoir plus de droits que son appelant
    permissions:
      contents: write
      packages: write
    with:
      image: ghcr.io/t3hx/solarsys-react-app
      prod-url: ${{ vars.PROD_URL }}
      origin-ip: ${{ vars.VPS_TAILSCALE_IP }}
    secrets: inherit
